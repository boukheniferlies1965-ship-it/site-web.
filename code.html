<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Ranking Sheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #ranking {
            margin-top: 20px;
            padding: 10px;
            background-color: #e9f7ef;
            border-radius: 4px;
        }
        #ranking h2 {
            margin-top: 0;
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 5px 0;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stage Ranking Sheet</h1>
        <p>Each person: Fill your name and optional order, then submit to see the ranking!</p>
        <form id="rankingForm">
            <label for="performerName">Your Name</label>
            <input type="text" id="performerName" name="performerName" required>

            <label for="presentationOrder">Desired Order (1 to 20, optional)</label>
            <select id="presentationOrder" name="presentationOrder">
                <option value="">No preference</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
            </select>

            <button type="submit">Submit and View Ranking</button>
        </form>
        <div id="ranking">
            <h2>Current Ranking</h2>
            <ul id="rankingList">
                <li>No entries yet.</li>
            </ul>
        </div>
    </div>
    <script>
        let rankings = []; // Array to store submissions

        document.getElementById('rankingForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('performerName').value;
            const order = document.getElementById('presentationOrder').value;
            const entry = { name: name, order: order ? parseInt(order) : null };
            rankings.push(entry);
            updateRanking();
            document.getElementById('rankingForm').reset();
        });

        function updateRanking() {
            // Sort rankings: first by desired order (ascending), then by submission order for ties or no preference
            rankings.sort((a, b) => {
                if (a.order === null && b.order === null) return 0; // Both no preference, keep submission order
                if (a.order === null) return 1; // a has no preference, put after b
                if (b.order === null) return -1; // b has no preference, put after a
                return a.order - b.order; // Sort by order number
            });

            const rankingList = document.getElementById('rankingList');
            rankingList.innerHTML = '';
            rankings.forEach((entry, index) => {
                const li = document.createElement('li');
                const displayText = entry.order ? `${entry.name} (Desired Order: ${entry.order})` : `${entry.name} (No preference)`;
                li.textContent = `${index + 1}. ${displayText}`;
                rankingList.appendChild(li);
            });
        }
    </script>
</body>
</html>
